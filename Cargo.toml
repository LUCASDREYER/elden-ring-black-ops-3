[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
bridge-link = { path = "crates/bridge-link" }
cod-assets = { path = "crates/cod-assets" }
memmap2 = "0.9"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std"] }
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

[profile.dev.package."*"]
opt-level = 2
